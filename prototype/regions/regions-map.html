<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LA Ride Regions</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --panel: #f6f6f4; --border: #ddd; --accent: #990000; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161616; --fg: #eee; --muted: #aaa; --panel: #222; --border: #333; --accent: #ffcc00; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
    .app { display: flex; height: 100%; }
    #map { flex: 1; }
    aside { width: 300px; overflow-y: auto; padding: 16px; background: var(--panel); border-left: 1px solid var(--border); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .hint { color: var(--muted); margin: 0 0 12px; }
    #result { padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; min-height: 44px; background: var(--bg); }
    #result b { color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; gap: 8px; align-items: center; padding: 5px 4px; border-radius: 6px; cursor: pointer; }
    li:hover { background: var(--bg); }
    .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .region-label { background: none; border: none; box-shadow: none; font-weight: 600; font-size: 11px; color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
    .region-label::before { display: none; }
    @media (max-width: 700px) { .app { flex-direction: column; } aside { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border); } }
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>
    <aside>
      <h1>LA ride regions</h1>
      <p class="hint">Click anywhere on the map to see which region that destination is assigned to.</p>
      <div id="result">No point selected.</div>
      <ul id="list"></ul>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="regions.js"></script>
  <script>
    const { REGIONS, PICKUPS, assignRegion, centroid, distanceKm } = window.LARegions;
    const map = L.map("map").setView([34.04, -118.33], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const colors = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#9a6324","#469990","#800000","#808000","#000075"];
    const layers = {};
    REGIONS.forEach((r, i) => {
      const color = colors[i % colors.length];
      const layer = L.polygon(r.polygon.map(([lng, lat]) => [lat, lng]), { color, weight: 2, fillOpacity: 0.22 })
        .bindPopup(`<b>${r.name}</b><br>${r.landmarks.join(", ")}`)
        .addTo(map);
      const c = centroid(r.polygon);
      L.tooltip({ permanent: true, direction: "center", className: "region-label" }).setLatLng([c.lat, c.lng]).setContent(r.name).addTo(map);
      layers[r.id] = layer;

      const li = document.createElement("li");
      li.innerHTML = `<span class="sw" style="background:${color}"></span>${r.name}`;
      li.onclick = () => { map.fitBounds(layer.getBounds(), { maxZoom: 14 }); layer.openPopup(); };
      document.getElementById("list").appendChild(li);
    });

    PICKUPS.forEach((p) => L.circleMarker([p.lat, p.lng], { radius: 6, color: "#990000", fillColor: "#ffcc00", fillOpacity: 1, weight: 2 })
      .bindTooltip(`Pickup: ${p.name}`).addTo(map));

    let marker;
    map.on("click", (e) => {
      const { lat, lng } = e.latlng;
      if (marker) marker.remove();
      marker = L.marker([lat, lng]).addTo(map);
      const m = assignRegion(lat, lng);
      const fromUsc = distanceKm(PICKUPS[0], { lat, lng }).toFixed(1);
      document.getElementById("result").innerHTML = m
        ? `<b>${m.region.name}</b>${m.matched === "nearby" ? ` <span style="color:var(--muted)">(snapped, ${m.distanceKm.toFixed(2)} km outside)</span>` : ""}<br>${fromUsc} km from USC Village`
        : `Not in any region (would show as "Other")<br>${fromUsc} km from USC Village`;
    });
  </script>
</body>
</html>
